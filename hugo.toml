baseURL = "https://my-blog-ten-sigma-14.vercel.app/"
languageCode = "zh-cn"
title = "Sky-given 的技术博客"
theme = "hugo-theme-stack"

# 核心模块配置：这是解决你目前报错的关键
[module]
  [[module.imports]]
    # 强制使用 v3 版本，避免 v4 带来的构建错误
    path = "github.com/CaiJimmy/hugo-theme-stack/v3"

[params]
    # 以后你可以在这里修改你的名字和描述
    header = {
        title = "Sky-given",
        subtitle = "正在探索 Hugo 的博主"
    }
    footer = {
        since = 2024
    }
